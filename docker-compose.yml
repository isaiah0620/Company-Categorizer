services:
  postgres:
    image: postgres:16-alpine
    container_name: company-categorizer-db
    environment:
      POSTGRES_USER: categorizer
      POSTGRES_PASSWORD: localtestpassword
      POSTGRES_DB: company_categorizer
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U categorizer -d company_categorizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: company-categorizer-app
    env_file:
      - .env
    environment:
      # ---- Local Postgres (overrides whatever .env's DATABASE_URL says) ----
      # Comment this line out to run against your REAL database instead.
      DATABASE_URL: postgresql://categorizer:localtestpassword@postgres:5432/company_categorizer

      # ---- Scraper selection ------------------------------------------------
      # Flip Tavily on/off right here without touching .env or the code.
      #
      #   TAVILY_ENABLED=false                -> Firecrawl only (default)
      #   TAVILY_ENABLED=true  + SCRAPE_PROVIDER=firecrawl
      #                                       -> Firecrawl first, Tavily rescues
      #                                          the domains Firecrawl fails on
      #   TAVILY_ENABLED=true  + SCRAPE_PROVIDER=tavily
      #                                       -> Tavily first, Firecrawl as backup
      #
      # ${VAR:-default} reads from your shell, so you can also do:
      #   TAVILY_ENABLED=true SCRAPE_PROVIDER=tavily docker compose up
      TAVILY_ENABLED: "${TAVILY_ENABLED:-false}"
      SCRAPE_PROVIDER: "${SCRAPE_PROVIDER:-firecrawl}"
      SCRAPE_FALLBACK_PROVIDER: "${SCRAPE_FALLBACK_PROVIDER:-tavily}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      TAVILY_EXTRACT_DEPTH: "${TAVILY_EXTRACT_DEPTH:-basic}"

      # ---- Multi-page crawl (Tavily only) -----------------------------------
      # Tavily map -> `sitemap` column; extracted pages -> `scraped_text` column
      # and the model's input. SITE_CRAWL_ENABLED=false = homepage only.
      SITE_CRAWL_ENABLED: "${SITE_CRAWL_ENABLED:-true}"
      SITE_MAX_PAGES: "${SITE_MAX_PAGES:-4}"
      SITE_MAP_LIMIT: "${SITE_MAP_LIMIT:-30}"

      # ---- Name + domain pre-screen ------------------------------------------
      # NAME_SCREEN_ENABLED=false skips the pre-screen and sends every company
      # straight to scrape + categorize, exactly as before.
      NAME_SCREEN_ENABLED: "${NAME_SCREEN_ENABLED:-true}"
      NAME_SCREEN_MIN_CONFIDENCE: "${NAME_SCREEN_MIN_CONFIDENCE:-0.9}"

      # ---- Throughput -------------------------------------------------------
      # Keep these low while testing so you don't burn credits.
      BATCH_SIZE: "${BATCH_SIZE:-5}"
      PIPELINE_CONCURRENCY: "${PIPELINE_CONCURRENCY:-2}"
    depends_on:
      postgres:
        condition: service_healthy
    # Default: one batch, then exit - good for testing and for letting an
    # OS-level scheduler decide the cadence.
    #
    # For an always-on container that schedules itself with node-cron, use:
    #   command: ["node", "dist/index.js"]
    #   restart: unless-stopped
    command: ["node", "dist/index.js", "--once"]

  # The HTTP API: same image, different command. Needs API_KEY in .env.
  #   docker compose up --build api
  #   curl -X POST localhost:8080/v1/companies/categorize \
  #     -H "Authorization: Bearer $API_KEY" -H "Content-Type: application/json" \
  #     -d '{"domain":"stripe.com","name":"Stripe"}'
  api:
    build: .
    container_name: company-categorizer-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://categorizer:localtestpassword@postgres:5432/company_categorizer
      TAVILY_ENABLED: "${TAVILY_ENABLED:-false}"
      SCRAPE_PROVIDER: "${SCRAPE_PROVIDER:-firecrawl}"
      SCRAPE_FALLBACK_PROVIDER: "${SCRAPE_FALLBACK_PROVIDER:-tavily}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      API_PORT: "8080"
    ports:
      - "9090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/server.js"]
    restart: unless-stopped

volumes:
  pgdata:
